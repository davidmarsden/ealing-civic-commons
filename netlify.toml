[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/.netlify/functions/feed"
  to = "/.netlify/functions/combined-feed"
  status = 200
  force = true

[[redirects]]
  from = "/data/contributions.json"
  to = "/.netlify/functions/public-contributions"
  status = 200
  force = true

[[redirects]]
  from = "/items/*"
  to = "/item.html"
  status = 200

[[redirects]]
  from = "/people/*"
  to = "/entity.html"
  status = 200

[[redirects]]
  from = "/organisations/*"
  to = "/entity.html"
  status = 200

[[redirects]]
  from = "/places/*"
  to = "/entity.html"
  status = 200

[[redirects]]
  from = "/issues/*"
  to = "/issue.html"
  status = 200

[[redirects]]
  from = "/topics/*"
  to = "/topic.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
