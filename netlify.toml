[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# civiccommons.co.uk / www.civiccommons.co.uk hostname routing is handled by
# netlify/edge-functions/civiccommons-router.js. This avoids unsupported Host
# redirect conditions while keeping ealing.civiccommons.co.uk on the Ealing app.

# Keep the retired Southall hostname as a doorway into the canonical Commons.
# Use temporary redirects until the new destination has been verified across browsers,
# avoiding another permanently cached incorrect root redirect.
[[redirects]]
  from = "https://commons.southallstories.uk/"
  to = "https://ealing.civiccommons.co.uk/?town=Southall"
  status = 302
  force = true

[[redirects]]
  from = "https://commons.southallstories.uk/*"
  to = "https://ealing.civiccommons.co.uk/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/data/contributions.json"
  to = "/.netlify/functions/public-contributions"
  status = 200
  force = true

[[redirects]]
  from = "/items/*"
  to = "/item.html"
  status = 200

[[redirects]]
  from = "/people/*"
  to = "/entity.html"
  status = 200

[[redirects]]
  from = "/organisations/*"
  to = "/entity.html"
  status = 200

[[redirects]]
  from = "/places/*"
  to = "/entity.html"
  status = 200

[[redirects]]
  from = "/issues/*"
  to = "/issue.html"
  status = 200

[[redirects]]
  from = "/topics/*"
  to = "/topic.html"
  status = 200

[[headers]]
  for = "/brand/social/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "image/jpeg"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
