[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Keep the retired Southall hostname as a doorway into the canonical Commons.
# Use temporary redirects until the new destination has been verified across browsers,
# avoiding another permanently cached incorrect root redirect.
[[redirects]]
  from = "https://commons.southallstories.uk/"
  to = "https://ealing.civiccommons.co.uk/?town=Southall"
  status = 302
  force = true

[[redirects]]
  from = "https://commons.southallstories.uk/*"
  to = "https://ealing.civiccommons.co.uk/:splat"
  status = 302
  force = true

# Social crawlers receive a simple, stable JPEG URL. Netlify renders the approved
# SVG source internally so WhatsApp/Bluesky do not have to consume an Image CDN URL.
[[redirects]]
  from = "/brand/social/:town.jpg"
  to = "/.netlify/images?url=/brand/social/:town.svg&w=1200&h=630&fit=cover&fm=jpg"
  status = 200
  force = true

[[redirects]]
  from = "/.netlify/functions/feed"
  to = "/.netlify/functions/combined-feed"
  status = 200
  force = true

[[redirects]]
  from = "/data/contributions.json"
  to = "/.netlify/functions/public-contributions"
  status = 200
  force = true

[[redirects]]
  from = "/items/*"
  to = "/item.html"
  status = 200

[[redirects]]
  from = "/people/*"
  to = "/entity.html"
  status = 200

[[redirects]]
  from = "/organisations/*"
  to = "/entity.html"
  status = 200

[[redirects]]
  from = "/places/*"
  to = "/entity.html"
  status = 200

[[redirects]]
  from = "/issues/*"
  to = "/issue.html"
  status = 200

[[redirects]]
  from = "/topics/*"
  to = "/topic.html"
  status = 200

[[headers]]
  for = "/brand/social/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
