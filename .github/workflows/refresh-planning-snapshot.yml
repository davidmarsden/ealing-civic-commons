name: Refresh planning snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 2'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest latest completed PAM week
        run: npm run inspect:planning-ingest
      - name: Build latest snapshot and durable archive
        run: npm run publish:planning-snapshot
      - name: Open refresh pull request when planning data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/planning-latest.json public/data/planning-archive.json; then
            echo "Planning data unchanged."
            exit 0
          fi
          branch="automation/planning-snapshot-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/data/planning-latest.json public/data/planning-archive.json
          git commit -m "Refresh planning data"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "Refresh Ealing planning data" --body "Automated refresh from the latest completed Ealing PAM weekly list. This PR updates both the latest-week view and the durable planning archive; Ealing Council's planning register remains authoritative, and Netlify deploys remain independent of PAM availability."
      - name: Upload inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ealing-planning-ingest
          path: ealing-planning-ingest.json
          retention-days: 7
