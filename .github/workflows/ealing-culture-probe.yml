name: Ealing Culture source probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ealing-culture-probe.mjs'
      - 'package.json'
      - '.github/workflows/ealing-culture-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Ealing Culture probe
        run: node scripts/ealing-culture-probe.mjs --verbose --output=ealing-culture-probe.json || true

      - name: Validate probe result
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('ealing-culture-probe.json', 'utf8'));
          const structured = Boolean(report.summary?.wordpress_structured_collections_available);
          const homepage = Boolean(report.endpoints?.homepage?.ok);
          if (!structured && !homepage) {
            console.error('Probe failed: neither the structured WordPress collections nor the homepage were reachable.');
            process.exit(2);
          }
          if (!homepage && structured) {
            console.log('Homepage fetch failed, but structured WordPress collections are healthy; accepting probe result.');
          }
          NODE

      - name: Show probe result
        if: always()
        run: cat ealing-culture-probe.json || true

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ealing-culture-probe
          path: ealing-culture-probe.json
          if-no-files-found: warn
          retention-days: 7
