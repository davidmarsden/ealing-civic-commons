name: Ealing Culture source probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ealing-culture-probe.mjs'
      - 'package.json'
      - '.github/workflows/ealing-culture-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Ealing Culture probe
        run: node scripts/ealing-culture-probe.mjs --verbose --output=ealing-culture-probe.json

      - name: Show probe result
        if: always()
        run: cat ealing-culture-probe.json || true

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ealing-culture-probe
          path: ealing-culture-probe.json
          if-no-files-found: warn
          retention-days: 7
