name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:contributions
      - run: npm run validate:evidence
      - run: npm run test:planning-history
      - run: npm run test:whatdotheyknow
      - run: npm run test:civic-items
      - run: npm run test:archive-index-blobs
      - run: npm run test:feed-snapshot
      - run: npm run test:social-page
      - run: npm run test:civic-place-links
