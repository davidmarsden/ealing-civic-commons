name: PAM previous-week probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run previous-week PAM probe
        run: node scripts/pam-previous-week-probe.mjs --output=pam-previous-week-probe.json

      - name: Show probe result
        if: always()
        run: cat pam-previous-week-probe.json || true

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pam-previous-week-probe
          path: pam-previous-week-probe.json
          if-no-files-found: warn
          retention-days: 7
