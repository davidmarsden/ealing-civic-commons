name: Ealing data Southall probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'netlify/functions/ealing-data-probe.mjs'
      - 'public/ealing-data-probe.*'
      - '.github/workflows/ealing-data-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect live Southall LSOA values
        run: |
          node --input-type=module <<'NODE'
          async function layerRows(layer) {
            const url = new URL(`${layer}/query`);
            url.searchParams.set('where', '1=1');
            url.searchParams.set('outFields', '*');
            url.searchParams.set('returnGeometry', 'false');
            url.searchParams.set('f', 'json');
            const payload = await (await fetch(url)).json();
            if (payload.error) throw new Error(`${payload.error.code}: ${payload.error.message}`);
            return payload.features?.map(feature => feature.attributes || {}) || [];
          }
          const imdLsoa = await layerRows('https://services1.arcgis.com/HumUw0sDQHwJuboT/ArcGIS/rest/services/Ealing_Dep_IMD/FeatureServer/6');
          const southall = imdLsoa.filter(row => Object.values(row).some(value => typeof value === 'string' && /southall/i.test(value)));
          const fields = [
            'ID3091D20150101000000','ID3091D20190101000000','ID3091D20250101000000',
            'ID3089D20150101000000','ID3089D20190101000000','ID3089D20250101000000',
            'ID25375D20230101000000','ID30920D20230101000000','ID30919D20230101000000','ID30922D20230101000000',
            'ID44458D20210101000000','ID44455D20200101000000'
          ];
          const compact = row => Object.fromEntries(Object.entries(row).filter(([key]) => /lsoa|msoa|town|ward|name|code/i.test(key) || fields.includes(key)));
          const populated = Object.fromEntries(fields.map(field => [field, southall.filter(row => row[field] !== null && row[field] !== undefined && row[field] !== '').length]));
          console.log(JSON.stringify({ southallRows: southall.length, populated, samples: southall.slice(0, 5).map(compact) }, null, 2));
          if (southall.length < 1) throw new Error('No Southall LSOA rows found');
          const emptyFields = Object.entries(populated).filter(([, count]) => count === 0).map(([field]) => field);
          if (emptyFields.length) throw new Error(`Target fields empty across Southall LSOAs: ${emptyFields.join(', ')}`);
          NODE
