name: Ealing data Southall probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'netlify/functions/ealing-data-probe.mjs'
      - 'public/ealing-data-probe.*'
      - '.github/workflows/ealing-data-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Invoke live probe
        run: |
          node --input-type=module <<'NODE'
          async function layerRows(layer) {
            const url = new URL(`${layer}/query`);
            url.searchParams.set('where', '1=1');
            url.searchParams.set('outFields', '*');
            url.searchParams.set('returnGeometry', 'false');
            url.searchParams.set('f', 'json');
            const payload = await (await fetch(url)).json();
            return payload.features?.map(feature => feature.attributes || {}) || [];
          }
          const imdWard = await layerRows('https://services1.arcgis.com/HumUw0sDQHwJuboT/ArcGIS/rest/services/Ealing_Dep_IMD/FeatureServer/2');
          const imdTown = await layerRows('https://services1.arcgis.com/HumUw0sDQHwJuboT/ArcGIS/rest/services/Ealing_Dep_IMD/FeatureServer/5');
          const wardSouthall = imdWard.find(row => row.NAME === 'Southall Broadway');
          const townSouthall = imdTown.find(row => row.NAME === 'Southall');
          const wanted = /3091|3089|25375|30920|30919|30922|44458|44455/i;
          const picked = row => Object.fromEntries(Object.entries(row || {}).filter(([key]) => wanted.test(key)));
          console.log('VALUE FIELD DEBUG', JSON.stringify({
            wardKeys: Object.keys(wardSouthall || {}).filter(key => wanted.test(key)),
            wardValues: picked(wardSouthall),
            townKeys: Object.keys(townSouthall || {}).filter(key => wanted.test(key)),
            townValues: picked(townSouthall)
          }, null, 2));

          const mod = await import('./netlify/functions/ealing-data-probe.mjs');
          const response = await mod.default();
          const payload = await response.json();
          const summary = {
            httpStatus: response.status,
            status: payload.status,
            elapsedMs: payload.elapsedMs,
            geographyDiagnostics: payload.geographyDiagnostics,
            groups: (payload.groups || []).map(group => ({
              id: group.id,
              label: group.label,
              observations: (group.indicators || []).reduce(
                (total, indicator) => total + (indicator.instances || []).reduce(
                  (subtotal, instance) => subtotal + (instance.observations?.length || 0), 0
                ), 0
              ),
              indicators: (group.indicators || []).map(indicator => ({
                id: indicator.id,
                name: indicator.name,
                instances: (indicator.instances || []).map(instance => ({
                  date: instance.date,
                  geography: instance.geography?.name,
                  observations: instance.observations || [],
                  error: instance.error || null
                }))
              }))
            }))
          };
          console.log(JSON.stringify(summary, null, 2));
          if (!response.ok) throw new Error(`Probe returned HTTP ${response.status}`);
          if (!payload.groups?.length) throw new Error('Probe returned no groups');
          const emptyGroups = summary.groups.filter(group => group.observations === 0);
          if (emptyGroups.length) throw new Error(`Probe groups without Southall observations: ${emptyGroups.map(group => group.id).join(', ')}`);
          NODE
