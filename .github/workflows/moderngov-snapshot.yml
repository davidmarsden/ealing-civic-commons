name: ModernGov snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - 'feat/moderngov-whats-new'
    paths:
      - 'scripts/fetch-moderngov-snapshot.mjs'
      - 'netlify/functions/moderngov-whatsnew.mjs'
      - '.github/workflows/moderngov-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch ModernGov What's New
        run: node scripts/fetch-moderngov-snapshot.mjs
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- public/data/moderngov-whatsnew.json; then
            echo 'Snapshot unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/moderngov-whatsnew.json
          git commit -m 'Refresh ModernGov snapshot'
          git push
