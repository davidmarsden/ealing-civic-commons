name: PAM page diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run PAM page diagnostic
        run: node scripts/pam-page-diagnostic.mjs --output=pam-page-diagnostic.json

      - name: Show diagnostic result
        if: always()
        run: cat pam-page-diagnostic.json || true

      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ealing-pam-page-diagnostic
          path: pam-page-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
