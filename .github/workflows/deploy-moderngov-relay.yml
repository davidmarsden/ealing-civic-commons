name: Deploy ModernGov relay

on:
  push:
    branches: [main]
    paths:
      - 'ops/moderngov-relay/**'
      - '.github/workflows/deploy-moderngov-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-moderngov-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate relay JavaScript
        run: node --check ops/moderngov-relay/server.mjs

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MODERNGOV_RELAY_SSH_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing MODERNGOV_RELAY_SSH_KEY secret'; exit 1; }
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/moderngov-relay
          chmod 0600 ~/.ssh/moderngov-relay

      - name: Trust relay host key
        env:
          RELAY_HOST: ${{ vars.MODERNGOV_RELAY_HOST }}
          RELAY_HOST_KEY: ${{ secrets.MODERNGOV_RELAY_HOST_KEY }}
        run: |
          test -n "$RELAY_HOST" || { echo 'Missing MODERNGOV_RELAY_HOST repository/environment variable'; exit 1; }
          test -n "$RELAY_HOST_KEY" || { echo 'Missing MODERNGOV_RELAY_HOST_KEY secret'; exit 1; }
          printf '%s\n' "$RELAY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Deploy relay atomically
        env:
          RELAY_HOST: ${{ vars.MODERNGOV_RELAY_HOST }}
          RELAY_USER: ${{ vars.MODERNGOV_RELAY_USER }}
        run: |
          set -euo pipefail
          RELAY_USER="${RELAY_USER:-root}"
          SSH=(ssh -i ~/.ssh/moderngov-relay -o BatchMode=yes -o StrictHostKeyChecking=yes "$RELAY_USER@$RELAY_HOST")
          SCP=(scp -i ~/.ssh/moderngov-relay -o BatchMode=yes -o StrictHostKeyChecking=yes)

          "${SCP[@]}" ops/moderngov-relay/server.mjs "$RELAY_USER@$RELAY_HOST:/tmp/ealing-moderngov-relay.server.mjs"
          "${SCP[@]}" ops/moderngov-relay/ealing-moderngov-relay.service "$RELAY_USER@$RELAY_HOST:/tmp/ealing-moderngov-relay.service"

          "${SSH[@]}" 'set -euo pipefail
            node --check /tmp/ealing-moderngov-relay.server.mjs
            install -d -m 0755 /opt/ealing-moderngov-relay
            install -m 0644 /tmp/ealing-moderngov-relay.server.mjs /opt/ealing-moderngov-relay/server.mjs
            install -m 0644 /tmp/ealing-moderngov-relay.service /etc/systemd/system/ealing-moderngov-relay.service
            rm -f /tmp/ealing-moderngov-relay.server.mjs /tmp/ealing-moderngov-relay.service
            systemctl daemon-reload
            systemctl enable ealing-moderngov-relay.service
            systemctl restart ealing-moderngov-relay.service
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error http://127.0.0.1:8788/health >/dev/null; then exit 0; fi
              sleep 2
            done
            systemctl status --no-pager ealing-moderngov-relay.service || true
            exit 1'

      - name: Verify public relay endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://chat-dev.ealing.civiccommons.co.uk/_relay/moderngov/health >/dev/null
          curl --fail --silent --show-error https://chat-dev.ealing.civiccommons.co.uk/_relay/moderngov/rss >/dev/null
          curl --fail --silent --show-error https://chat-dev.ealing.civiccommons.co.uk/_relay/moderngov/petitions >/dev/null
