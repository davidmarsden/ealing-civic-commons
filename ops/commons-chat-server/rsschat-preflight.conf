[Service]
# Refuse to start rss.chat if the production config is malformed, SQLite is not
# explicitly enabled, rssnetwork.js has a syntax error, or better-sqlite3 cannot
# load under the Node runtime systemd is about to use.
#
# The preflight leaves node_modules alone when better-sqlite3 already works. If
# the native module fails to load (for example after a Node ABI change), it
# rebuilds only better-sqlite3 and verifies it again before allowing startup.
ExecStartPre=/usr/bin/bash /opt/rsschat/ops/preflight.sh /opt/rsschat /opt/rsschat/config.json
