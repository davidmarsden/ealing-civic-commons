<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatDoTheyKnow preview — Ealing Civic Commons</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/archive.css"></head><body><main class="archive-shell"><p class="eyebrow">Source preview</p><h1>WhatDoTheyKnow · Ealing</h1><p>This Deploy Preview can import up to 100 recent Ealing Council FOI/EIR requests into its isolated Civic Archive so we can inspect presentation and discovery before enabling production publication.</p><p><button id="publish" class="button" type="button">Import 100 requests into this preview</button> <a href="/archive.html?source=whatdotheyknow">Open Civic Archive →</a></p><pre id="status" style="white-space:pre-wrap" aria-live="polite">Nothing imported yet.</pre></main><script type="module">const button=document.querySelector('#publish'),status=document.querySelector('#status');button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Fetching and normalising WhatDoTheyKnow requests…';try{const response=await fetch('/.netlify/functions/whatdotheyknow-preview-publish?limit=100',{method:'POST'});const data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);status.textContent=`Imported ${data.normalised} requests.\nInserted: ${data.persistence.inserted} · Updated: ${data.persistence.updated} · Unchanged: ${data.persistence.unchanged} · Rejected: ${data.rejected}\n\nOpen the Civic Archive and choose WhatDoTheyKnow as the source.`}catch(error){status.textContent=`Import failed: ${error.message}`}finally{button.disabled=false}});</script></body></html>
