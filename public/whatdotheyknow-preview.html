<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatDoTheyKnow production dry run — Ealing Civic Commons</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/archive.css"></head><body><main class="archive-shell"><p class="eyebrow">Production pipeline test</p><h1>WhatDoTheyKnow · Ealing</h1><p>This Deploy Preview exercises the same static-IP relay → Atom parser → Civic Commons normaliser path used by the scheduled production publisher. It is deliberately read-only: nothing is written to the Civic Archive.</p><p><button id="run" class="button" type="button">Run production dry test</button></p><pre id="status" style="white-space:pre-wrap" aria-live="polite">Dry test has not run yet.</pre></main><script type="module">const button=document.querySelector('#run'),status=document.querySelector('#status');button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Fetching through the static-IP relay, parsing Atom and normalising requests…';try{const response=await fetch('/.netlify/functions/whatdotheyknow-preview-publish?limit=100',{method:'POST'});const data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);const sample=(data.sample||[]).map((item,index)=>`${index+1}. ${item.title||item.id}`).join('\n');status.textContent=`PASS — production acquisition pipeline completed.\n\nDiscovered: ${data.discovered}\nNormalised: ${data.normalised}\nWould upsert: ${data.wouldUpsert}\nRejected: ${data.rejected}\nWrites performed: 0 (dry run)${sample?`\n\nSample normalised items:\n${sample}`:''}`}catch(error){status.textContent=`FAIL — ${error.message}`}finally{button.disabled=false}});</script></body></html>
