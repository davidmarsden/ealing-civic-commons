<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Southall Civic Commons</title>
  <desc id="desc">Southall Civic Commons social sharing treatment using the Ealing oak family mark.</desc>
  <rect width="1200" height="630" rx="18" fill="#0f4a37"/>
  <rect y="490" width="1200" height="140" fill="#789579"/>
  <image href="/brand/ealing-oak-approved.webp" x="54" y="64" width="300" height="266" preserveAspectRatio="xMidYMid meet"/>
  <text x="408" y="112" fill="#e7dfc8" font-family="Georgia,Times New Roman,serif" font-size="34">Southall</text>
  <text x="404" y="204" fill="#fff9ea" font-family="Georgia,Times New Roman,serif" font-size="74" font-weight="500" letter-spacing="6">CIVIC</text>
  <text x="404" y="286" fill="#fff9ea" font-family="Georgia,Times New Roman,serif" font-size="74" font-weight="500" letter-spacing="3">COMMONS</text>
  <line x1="405" y1="316" x2="520" y2="316" stroke="#d5bc68" stroke-width="4"/>
  <text x="404" y="376" fill="#e7dfc8" font-family="Georgia,Times New Roman,serif" font-size="34" font-style="italic">What’s happening to Southall?</text>
  <g fill="#fff9ea" font-family="Inter,Arial,sans-serif" font-size="24">
    <text x="82" y="548">Publish</text><text x="82" y="579">anywhere.</text>
    <text x="340" y="548">Discuss</text><text x="340" y="579">anywhere.</text>
    <text x="590" y="548">Connect</text><text x="590" y="579">locally.</text>
    <text x="835" y="548">Remember</text><text x="835" y="579">civically.</text>
  </g>
  <g stroke="#e7dfc8" stroke-width="2" opacity=".72"><line x1="300" y1="514" x2="300" y2="598"/><line x1="550" y1="514" x2="550" y2="598"/><line x1="800" y1="514" x2="800" y2="598"/></g>
  <text x="1120" y="584" text-anchor="end" fill="#eef4ea" font-family="Inter,Arial,sans-serif" font-size="18" opacity=".9">commons.southallstories.uk</text>
</svg>
