<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Civic Commons</title>
  <desc id="desc">Network social card for Civic Commons.</desc>
  <rect width="1200" height="630" fill="#f6f4ee"/>
  <rect width="26" height="630" fill="#1f5b42"/>
  <g transform="translate(78 72)">
    <circle cx="92" cy="92" r="84" fill="#1f5b42"/>
    <path d="M118 50a49 49 0 1 0 0 84" fill="none" stroke="#f6f4ee" stroke-width="18" stroke-linecap="round"/>
    <path d="M109 67a30 30 0 1 0 0 50" fill="none" stroke="#f6f4ee" stroke-width="12" stroke-linecap="round" opacity=".92"/>
  </g>
  <text x="310" y="108" fill="#1f5b42" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="4">OPEN CIVIC INFRASTRUCTURE</text>
  <text x="306" y="205" fill="#18221d" font-family="Georgia,Times New Roman,serif" font-size="84" font-weight="700">Civic Commons</text>
  <text x="310" y="278" fill="#48524c" font-family="Georgia,Times New Roman,serif" font-size="35" font-style="italic">Local information. Shared civic memory.</text>
  <line x1="82" y1="456" x2="1118" y2="456" stroke="#1f5b42" stroke-width="3"/>
  <text x="82" y="516" fill="#173f30" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Publish anywhere.</text>
  <text x="328" y="516" fill="#173f30" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Connect locally.</text>
  <text x="548" y="516" fill="#173f30" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Remember civically.</text>
  <text x="82" y="570" fill="#68726c" font-family="Inter,Arial,sans-serif" font-size="22">A commons can belong to a place without belonging to a platform.</text>
  <text x="1118" y="570" text-anchor="end" fill="#1f5b42" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">civiccommons.co.uk</text>
</svg>
